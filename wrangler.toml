name = "rss-summarizer"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[triggers]
crons = ["0 */4 * * *"] # Every 4 hours

# KV namespace for storing seen item IDs
[[kv_namespaces]]
binding = "RSS_CACHE"
id = "549a8493533e40d3829737d431646c0d"

[vars]
OPENROUTER_MODEL = "deepseek/deepseek-chat"
USER_AGENT = "rss-summarizer:v1.0 (by /u/rss-summarizer-bot)"
MAX_ITEMS_PER_FEED = "15"

# Required Secrets to set via `npx wrangler secret put <NAME>`:
# - OPENROUTER_API_KEY
# - TELEGRAM_BOT_TOKEN
# - TELEGRAM_CHAT_ID
# - ADMIN_KEY (required for manual /run trigger via Authorization header)
