name = "rss-summarizer"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[triggers]
crons = ["*/30 * * * *"] # Every 30 minutes

# KV namespace for storing seen item IDs
[[kv_namespaces]]
binding = "RSS_CACHE"
id = "549a8493533e40d3829737d431646c0d"

[vars]
OPENROUTER_MODEL = "deepseek/deepseek-chat"
USER_AGENT = "web:rss-summarizer:v1.0 (by /u/rss-summarizer-bot)"
FEEDS_PER_RUN = "1"
MIN_FEED_INTERVAL_HOURS = "4"

# Required Secrets to set via `npx wrangler secret put <NAME>`:
# - OPENROUTER_API_KEY
# - TELEGRAM_BOT_TOKEN
# - TELEGRAM_CHAT_ID
# - ADMIN_KEY (required for manual /run trigger via Authorization header)

[observability]
enabled = false
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

